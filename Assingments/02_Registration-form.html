<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="style2.css">
    
</head>
<body>
    <form action="">
    <label for="name">Name:</label>
    <input type="text" placeholder="Enter Your Name" id="name">
    <br>
    <br>
    <label for="email">Email Id:</label>
    <input type="email" placeholder=" Enter Your Email Id" id="email">
    <br>
    <br>
    <label for="pass">Password</label>
    <input type="password" placeholder=" Enter Password" id=" pass">
    <br>
    <br>
    <label>Age:</label>
    <input type="number" name="age">
    <br>
    <br>
    <label for="des">description:</label>

    <textarea name="" id="des" placeholder="Enter Your description"></textarea>
    <br>
    <br>


    <label>Gender:</label>

    <input type="radio" name="gender" id ="male">
    <label for="male">Male</label>
     
    <input type="radio" name="gender" id="female">
    <label for="female">Female</label>
    
    <br>
    <br>

    <label for="coun">Country</label>
    <select name="Country" id="coun">
        <option value="">India</option>
        <option value="">USA</option>
        <option value="">China</option>
        <option value="">Russia</option>
    </select>
    <br>
    <br>
    <input type="checkbox" name="Agreement" id="agree">
    <label for="Agree">Agree to Submit the Details: </label>
    <br>
    <br>
        <button type="submit">Submit</button>
     
</form>
    
</body>
</html>
